name: Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - docs/**
      - tools/Build-Docs.ps1
      - Meta/**
      - .github/workflows/pages.yml

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          # .gitattributes stores *.svg (logo, favicon) in Git LFS.
          lfs: true

      # Without Settings > Pages > Source = GitHub Actions, build only and warn.
      - name: Check GitHub Pages setting
        id: pages
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          try {
            $site = Invoke-RestMethod -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/pages" -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
            }
            $enabled = $site.build_type -eq 'workflow'
          } catch {
            $enabled = $false
          }
          if (-not $enabled) {
            "::warning title=GitHub Pages is not enabled::Set Settings > Pages > Source to 'GitHub Actions'. The documentation is built but not deployed."
          }
          "enabled=$($enabled.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Cache documentation tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: target/docs-tools
          key: docs-tools-${{ hashFiles('tools/Build-Docs.ps1') }}

      - name: Configure GitHub Pages
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Build documentation
        shell: pwsh
        run: ./tools/Build-Docs.ps1

      - name: Upload GitHub Pages artifact
        if: steps.pages.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: target/book

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
