[package]
name = "rte_syntax"
version.workspace = true
edition.workspace = true
publish.workspace = true

[features]
# Query trimming (`cargo xtask syntax-queries`).
generate = []

[dependencies]
libmimalloc-sys = { version = "0.1.49", default-features = false, features = ["extended"] }
rte_text = { path = "../rte_text" }
streaming-iterator = "0.1"
tree-sitter = "0.27"
tree-sitter-bash = "0.25"
tree-sitter-batch = "0.11.1"
tree-sitter-c = "0.24"
tree-sitter-c-sharp = "0.23"
tree-sitter-cpp = "0.23"
tree-sitter-css = "0.25"
tree-sitter-go = "0.25"
tree-sitter-html = "0.23"
tree-sitter-java = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-json = "0.24"
tree-sitter-julia = "0.23"
tree-sitter-lua = "0.5"
tree-sitter-matlab = "1.3"
tree-sitter-md = "0.5"
tree-sitter-powershell = "0.26"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-sequel = "0.3"
tree-sitter-toml-ng = "0.7"
tree-sitter-typescript = "0.23"
tree-sitter-xml = "0.7"
tree-sitter-yaml = "0.7"

[lints]
workspace = true
