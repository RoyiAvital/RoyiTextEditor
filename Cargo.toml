[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.4.2"
edition = "2024"
publish = false

[workspace.dependencies]
fancy-regex = "0.19"
memchr = "2"
regex-cursor = { version = "0.1.5", default-features = false, features = ["perf-inline"] }
resvg = { version = "0.45", default-features = false }
saphyr-parser = "0.2"
serde_json = "1"
swash = "0.2"
unicode-width = "0.2"
windows-sys = "0.61"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
divan = "0.1"
proptest = "1"
ropey = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true

[profile.bench]
strip = false
